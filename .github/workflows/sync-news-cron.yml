# Workflow manual de sync de cached_articles.
# Originalmente era cron 2x/día, pero eso migró al crontab del VPS DonWeb
# (ver scripts/cron-sync.sh + /etc/cron.d/quenoticia). Acá queda solo como
# disparador manual (workflow_dispatch) para emergencies/debug.
#
# Secrets requeridos en GitHub (Settings > Secrets and variables > Actions):
#   SYNC_NEWS_BASE_URL - URL base del deploy (ej: https://www.quenoticia.com.ar). Sin barra final.
#   CRON_SECRET        - mismo valor que CRON_SECRET en el server.

name: Sync News Cron

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sync news (list)
        env:
          BASE_URL: ${{ secrets.SYNC_NEWS_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 120 \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            "${BASE_URL}/api/sync-news" \
            -o sync-response.json
          cat sync-response.json

      - name: Backfill details (images + body)
        env:
          BASE_URL: ${{ secrets.SYNC_NEWS_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 300 \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            "${BASE_URL}/api/backfill-details" \
            -o backfill-response.json
          cat backfill-response.json